name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate app icon
        run: python scripts/make_icon.py

      - name: Generate platform icons
        run: npx tauri icon app-icon.png

      - name: Build (release)
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri\target\release\aerofiles.exe artifacts\AeroFiles-portable.exe
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: prism-files-windows
          path: artifacts/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
