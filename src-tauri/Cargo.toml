[package]
name = "aerofiles"
version = "0.1.2"
edition = "2021"
description = "AeroFiles — a glassmorphism file explorer for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
dirs = "5"
sysinfo = "0.33"
winreg = "0.52"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
