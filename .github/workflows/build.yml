name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate app icon
        run: python scripts/make_icon.py

      - name: Generate platform icons
        run: npx tauri icon app-icon.png

      - name: Run tests
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -vv *> test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $m = Select-String -Path test.log -Pattern "error: failed to run custom build command|panicked at|assertion failed" | Select-Object -First 3
            foreach ($hit in $m) {
              "::error::HIT> $($hit.Line)"
              if ($hit.Context -and $hit.Context.PostContext) {
                $hit.Context.PostContext | Select-Object -First 40 | ForEach-Object { "::error::CTX> $_" }
              }
            }
          }
          Get-Content test.log -Tail 25
          exit $code

      - name: Build (release)
        shell: pwsh
        run: |
          npx tauri build *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 60
          exit $code

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri\target\release\aerofiles.exe artifacts\AeroFiles-portable.exe
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: AeroFiles-windows
          path: artifacts/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
